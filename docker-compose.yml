services:
  bim-guard:
    build: .
    image: bim-guard:latest
    container_name: bim-guard-app
    ports:
      - "8000:8000"
    environment:
      # Supabase — required; all data and file storage lives here
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Backend selectors (defaults already set in image; explicit here for clarity)
      - BIM_GUARD_DB_BACKEND=supabase
      - BIM_GUARD_STORAGE_BACKEND=supabase
      # AI rule extraction
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - BIM_GUARD_RULE_MODEL=${BIM_GUARD_RULE_MODEL:-gemini/gemini-2.0-flash}
    volumes:
      # Persist the Supabase Storage file cache across container restarts
      - bim-guard-cache:/app/data/cache
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  bim-guard-cache:
