# ==============================================================================
# BIM Guard Docker Compose Configuration
# FastAPI Backend Gateway + Svelte 5 SPA + Supabase & LLM Integration
# ==============================================================================

services:
  bim-guard:
    build:
      context: .
      dockerfile: Dockerfile
    image: bim-guard:latest
    container_name: bim-guard-app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # ── Supabase Configuration (Required for database & file storage) ────────
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-bim-guard-artifacts}
      - SUPABASE_STORAGE_PREFIX=${SUPABASE_STORAGE_PREFIX:-}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN:-}

      # ── LLM Extraction & Agent Providers ────────────────────────────────────
      - BIM_GUARD_LLM_MODEL=${BIM_GUARD_LLM_MODEL:-openrouter/auto}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://127.0.0.1:8000}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-BIM Guard}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://localhost:11434}

      # ── Document Parsing — Unstructured ──────────────────────────────────────
      # Only consulted to seed the parsing_engine_instances registry on
      # first boot (Settings > Parsing Engines is the source of truth afterwards).
      - UNSTRUCTURED_API_KEY=${UNSTRUCTURED_API_KEY:-}
      - UNSTRUCTURED_API_URL=${UNSTRUCTURED_API_URL:-}
      - UNSTRUCTURED_STRATEGY=${UNSTRUCTURED_STRATEGY:-auto}
      # Leave unset unless the `unstructured-api` service below is enabled
      # (`docker compose --profile unstructured up -d`); then set this to
      # http://unstructured-api:8000 — its internal compose network address,
      # not the host-published UNSTRUCTURED_LOCAL_PORT — in your .env.
      - UNSTRUCTURED_LOCAL_URL=${UNSTRUCTURED_LOCAL_URL:-}

      # ── Document Parsing — Docling ───────────────────────────────────────────
      # Hosted Docling Serve account (e.g. https://developer.dcls.saas.ibm.com).
      - DOCLING_SERVICE_URL=${DOCLING_SERVICE_URL:-}
      - DOCLING_API_KEY=${DOCLING_API_KEY:-}
      # Leave unset unless the `docling-serve` service below is enabled
      # (`docker compose --profile docling up -d`); then set this to
      # http://docling-serve:5001 — its internal compose network address,
      # not the host-published DOCLING_LOCAL_PORT — in your .env.
      - DOCLING_LOCAL_URL=${DOCLING_LOCAL_URL:-}

      # ── Terminal Agent Configuration ────────────────────────────────────────
      - BIM_GUARD_AGENT_MODEL=${BIM_GUARD_AGENT_MODEL:-openrouter/auto}
      - BIM_GUARD_AGENT_MAX_STEPS=${BIM_GUARD_AGENT_MAX_STEPS:-20}
      - BIM_GUARD_AGENT_MAX_COST=${BIM_GUARD_AGENT_MAX_COST:-1.0}
      - BIM_GUARD_AGENT_WEB_SEARCH=${BIM_GUARD_AGENT_WEB_SEARCH:-1}

      # ── Runtime & Feature Configuration ─────────────────────────────────────
      - BIM_GUARD_STORAGE_BACKEND=supabase
      - BIM_GUARD_VERBOSITY=${BIM_GUARD_VERBOSITY:-1}
      - BIM_GUARD_LOG_LEVEL=${BIM_GUARD_LOG_LEVEL:-INFO}
      - FEATURE_PATH_B_MM=${FEATURE_PATH_B_MM:-0}
      - FEATURE_PATH_B_XM=${FEATURE_PATH_B_XM:-0}
      - BIM_GUARD_ALLOWED_ORIGINS=${BIM_GUARD_ALLOWED_ORIGINS:-}

    volumes:
      # Persistent cache for downloaded IFC models & artifacts
      - bim-guard-cache:/app/data/cache
      # Persistent storage for agent conversation sessions
      - bim-guard-sessions:/app/data/agent-sessions
      # Persistent application logs
      - bim-guard-logs:/app/data/logs

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  # ── Optional: local self-hosted Unstructured parsing engine ─────────────────
  # Open-source `unstructured-api` REST server (partition-only; distinct from
  # the `unstructured-io/unstructured` offline library image documented at
  # https://docs.unstructured.io/open-source/installation/docker-installation
  # — this is the HTTP server product needed so bim-guard can call it as a
  # parsing-engine instance: https://github.com/Unstructured-IO/unstructured-api).
  # Not started by default — bring it up explicitly with:
  #   docker compose --profile unstructured up -d
  # Then register it as a parsing engine instance in Settings > Parsing
  # Engines (kind "local", API URL http://localhost:${UNSTRUCTURED_LOCAL_PORT:-8001}
  # from the host, or http://unstructured-api:8000 from inside this compose
  # network — e.g. set UNSTRUCTURED_LOCAL_URL above to that and restart
  # bim-guard to have it seeded automatically on first boot).
  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    container_name: bim-guard-unstructured
    profiles: ["unstructured"]
    ports:
      - "${UNSTRUCTURED_LOCAL_PORT:-8001}:8000"
    healthcheck:
      # No curl in this image — use the Python that's already there.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Optional: local self-hosted Docling parsing engine ───────────────────────
  # Open-source `docling-serve` REST server
  # (https://github.com/docling-project/docling-serve). Not started by
  # default — bring it up explicitly with:
  #   docker compose --profile docling up -d
  # Then register it as a parsing engine instance in Settings > Parsing
  # Engines (kind "docling-local", API URL http://localhost:${DOCLING_LOCAL_PORT:-5001}
  # from the host, or http://docling-serve:5001 from inside this compose
  # network — e.g. set DOCLING_LOCAL_URL above to that and restart bim-guard
  # to have it seeded automatically on first boot). No API key by default.
  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: bim-guard-docling
    profiles: ["docling"]
    ports:
      - "${DOCLING_LOCAL_PORT:-5001}:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
    healthcheck:
      # No curl in this image — use the Python that's already there.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  bim-guard-cache:
    name: bim-guard-cache
  bim-guard-sessions:
    name: bim-guard-sessions
  bim-guard-logs:
    name: bim-guard-logs
