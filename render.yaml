# Render.com deployment configuration
# https://render.com/docs/render-yaml
#
# Deploy: connect this repo in the Render dashboard, then set the secret env vars
# marked `sync: false` under Environment → Secret Files / Environment Variables.

services:
  - type: web
    name: bim-guard
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter          # upgrade to standard for more RAM (ifcopenshell is heavy)
    region: oregon         # change to your preferred region
    branch: main
    autoDeploy: true       # redeploy on every push to `branch`
    healthCheckPath: /api/health

    envVars:
      # ── Supabase — set these in the Render dashboard (never commit secrets) ─
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: bim-guard-artifacts

      # ── AI rule extraction & Agent Providers ────────────────────────────────
      - key: BIM_GUARD_LLM_MODEL
        value: openrouter/auto
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

    # Render free/starter tier has ephemeral storage — the Supabase Storage
    # file cache (data/cache) will be rebuilt on first access after each deploy.
    # Add a Render Disk here if you want cache to persist across deploys:
    #
    # disk:
    #   name: bim-guard-cache
    #   mountPath: /app/data/cache
    #   sizeGB: 1
