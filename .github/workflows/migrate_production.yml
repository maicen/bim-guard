name: Migrate Production Database (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Migration action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'dry-run'
          - 'status'
      branch:
        description: 'Branch to pull migrations from (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /Users/sam/coding/bim-guard
    steps:
      - name: Sync Git Repository
        run: |
          TARGET_BRANCH="${{ github.event.inputs.branch || 'main' }}"
          echo "==> Configuring safe.directory..."
          git config --global --add safe.directory /Users/sam/coding/bim-guard || true

          echo "==> Fetching latest changes for branch '$TARGET_BRANCH' from origin..."
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET_BRANCH":refs/remotes/origin/"$TARGET_BRANCH"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Notice: Uncommitted changes detected in working tree; stashing..."
            git stash push -u -m "Auto-stashed by migrate workflow $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          echo "==> Checking out migrations from origin/$TARGET_BRANCH..."
          git checkout "origin/$TARGET_BRANCH" -- supabase/migrations/ || true

      - name: Execute Migration Action
        run: |
          ACTION="${{ github.event.inputs.action || 'apply' }}"
          echo "==> Selected action: $ACTION"
          if [ "$ACTION" = "status" ]; then
            uv run python scripts/migrate_production.py --status
          elif [ "$ACTION" = "dry-run" ]; then
            uv run python scripts/migrate_production.py --dry-run
          else
            uv run python scripts/migrate_production.py --apply
          fi

      - name: Verify PostgREST Health
        run: |
          echo "==> Verifying PostgREST response on Kong gateway..."
          RES=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:54321/rest/v1/ || true)
          echo "Kong /rest/v1/ HTTP Status: $RES"
