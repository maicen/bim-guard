[project]
name = "bim-guard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastlite>=0.1.1",
    "litellm>=1.0.0",
    "ifcopenshell>=0.8.4.post1",
    "networkx>=3.6.1",
    "openai>=1.0.0",
    "pandas>=3.0.2",
    "pypdf>=4.3.1",
    "python-dotenv>=1.0.1",
    "pyvis>=0.3.2",
    "supabase>=2.29.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0",
    "postgrest<=3.0.0a1",
    "psutil>=7.2.2",
    "matplotlib>=3.11.1",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "cachetools>=5.5.0",
    "firecrawl-py>=4.40.0",
    "unstructured-client>=0.46.2",
    "python-docx>=1.1.0",
    "llama-index-core>=0.12.0",
    "llama-index-llms-litellm>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.2.0",
    "ifctester>=0.8.5",
    "scipy>=1.11",
    "docling-slim>=2.124.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.scripts]
bim-guard-agent = "app.agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in __init__
    "E501", # Line too long
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[dependency-groups]
ml-pipeline = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.4.0",
    "spacy>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-json-report>=1.5.0",
    # Validates generated BCF archives against the vendored buildingSMART
    # 2.1 XSDs in tests/schemas/bcf21/ (tests/test_bcf_generator.py).
    "pytest-xdist>=3.8.0",
    "xmlschema>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "app/modules/tests"]
addopts = "-n auto -m 'not slow'"
markers = [
    "slow: marks tests that need real PDFs/full engine runs and are slow",
    "llm: marks tests that call the LLM (slow, costs tokens)",
    "integration: marks end-to-end pipeline tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:supabase.*:",
    "ignore::DeprecationWarning:postgrest.*:",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*Using `httpx` with `starlette.testclient`.*",
    "ignore:.*The 'timeout' parameter is deprecated.*:DeprecationWarning",
    "ignore:.*The 'verify' parameter is deprecated.*:DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
